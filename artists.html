<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists | Latin Hustle & Salsa United Congress</title>
    <meta name="description" content="Meet the incredible artists performing at Latin Hustle & Salsa United Congress - featuring world-class dancers and instructors.">
    <meta property="og:title" content="Latin Hustle & Salsa United Congress | Los Angeles, CA">
    <meta property="og:description" content="Experience LA's hottest dance event combining Latin Hustle and Salsa">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <header class="page-hero">
            <h1>World-Class <span class="accent">Artists</span></h1>
            <p class="lead">Experience workshops and performances from the best in Latin Hustle and Salsa.</p>
        </header>
        
        <section id="featured-artists">
            <h2>Featured Artists</h2>
            <div class="artist-grid">
                <!-- Artist cards will go here -->
                <article class="artist-card">
                    <img src="../imgs/artists/artist1.jpg" alt="Artist name">
                    <div class="artist-info">
                        <h3>Artist Name</h3>
                        <p class="artist-specialty">Latin Hustle</p>
                        <p class="artist-bio">Brief bio here...</p>
                    </div>
                </article>
                <!-- More artist cards -->
            </div>
        </section>

        <section id="performance-teams">
            <h2>Performance Teams</h2>
            <div class="team-grid">
                <!-- Team cards similar to artist cards -->
            </div>
        </section>

        <section class="cta-section">
            <h2>Want to see these artists live?</h2>
            <a href="passes.html" class="button">
                <span class="button-text">Get Your Pass</span>
                <i class="material-symbols-outlined">arrow_outward</i>
            </a>
        </section>
    </main>
    <footer id="footer-placeholder"></footer>
    <script src="./js/components.js"></script>
</body>
</html>
